services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: koawa_agent
      POSTGRES_USER: koawa_agent
      POSTGRES_PASSWORD: koawa_agent
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - koawa-agent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koawa_agent -d koawa_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/koawa_agent
      DB_USERNAME: koawa_agent
      DB_PASSWORD: koawa_agent
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
    ports:
      - "${SERVER_PORT:-9090}:9090"

volumes:
  koawa-agent-postgres:
